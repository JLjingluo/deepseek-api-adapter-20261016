name: Investigate original IPA in ARM simulator
on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Include the adapter and test-only native decoder observations
        type: boolean
        default: false
      mock_api:
        description: Configure a disposable local HTTPS chat fixture (adapter mode only)
        type: boolean
        default: false
      candidate_tag:
        description: Optional candidate-N release; use its compiled adapter instead of rebuilding it
        type: string
        default: ''
      test_focus:
        description: Run the complete native suite or focus on settings
        type: choice
        options: [all, settings, regeneration, startup, switching, attachment, liveimage, guest, options, history, direct]
        default: all
      startup_mode:
        description: Persist API mode before launch to reproduce restart failures
        type: choice
        options: [original, api]
        default: original
      live_api:
        description: Forward the disposable fixture to official API using a temporary secret
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download encrypted input and decrypt locally
        if: inputs.candidate_tag == ''
        env:
          INPUT_PASSWORD: ${{ secrets.IPA_PROBE_INPUT_PASSWORD }}
        run: |
          test -n "$INPUT_PASSWORD"
          curl --fail --location --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/probe-input-2.6.2/original.ipa.enc" \
            --output original.ipa.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in original.ipa.enc -out original.ipa -pass env:INPUT_PASSWORD
          echo '92a96bbbb7938f084a3840b4426bd891fe18dc46c1b6d4221186cb7df6cc18d9  original.ipa' | shasum -a 256 -c -
      - name: Download and verify a compiled candidate
        if: inputs.candidate_tag != ''
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          tag=os.environ['CANDIDATE_TAG']
          if not re.fullmatch(r'candidate-[0-9]+',tag): raise SystemExit('Invalid candidate tag')
          base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+tag+'/'
          name='DeepSeek-API-2.6.2-experimental-unsigned'
          urllib.request.urlretrieve(base+name+'.verification.json','input.verification.json')
          urllib.request.urlretrieve(base+name+'.ipa','original.ipa')
          expected=json.loads(pathlib.Path('input.verification.json').read_text())['ipa_sha256']
          if hashlib.sha256(pathlib.Path('original.ipa').read_bytes()).hexdigest()!=expected:
              raise SystemExit('Candidate identity mismatch')
          print('Verified candidate',tag,expected)
          PY
      - name: Probe original binary in a disposable simulator copy
        env:
          PROBE_LIVE_API: ${{ inputs.live_api }}
          TEST_API_KEY: ${{ inputs.live_api && secrets.DSAPI_TEMPORARY_TEST_KEY || '' }}
          PROBE_ADAPTER: ${{ inputs.adapter }}
          PROBE_MOCK_API: ${{ inputs.mock_api }}
          PROBE_PACKAGED_ADAPTER: ${{ inputs.candidate_tag != '' }}
          PROBE_STARTUP_MODE: ${{ inputs.startup_mode }}
          PROBE_UI_TEST_FOCUS: ${{ inputs.test_focus }}
        run: python3 ci_probe_simulator.py original.ipa
      - name: Remove temporary credentials from all published diagnostics
        if: always()
        env:
          TEST_API_KEY: ${{ inputs.live_api && secrets.DSAPI_TEMPORARY_TEST_KEY || '' }}
        run: |
          python3 - <<'PY_SANITIZE'
          import os,pathlib
          secret=os.environ.get('TEST_API_KEY','').encode()
          if secret:
              for path in pathlib.Path('diagnostics').rglob('*'):
                  if path.is_file():
                      data=path.read_bytes()
                      if secret in data:
                          if path.suffix.lower() in ('.log','.txt','.json','.ips'):
                              path.write_bytes(data.replace(secret,b'[REDACTED]'))
                          else:
                              path.unlink()
          PY_SANITIZE
      - name: Upload bounded diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-simulator-probe
          path: diagnostics/
          retention-days: 3
      - name: Publish diagnostics without the input app
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('probe-diagnostics.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for path in pathlib.Path('diagnostics').rglob('*'):
                  if path.is_file(): z.write(path,path.as_posix())
          PY
          gh release create "probe-results-${GITHUB_RUN_NUMBER}" --target "$GITHUB_REF_NAME" --prerelease \
            --title "Original binary simulator probe ${GITHUB_RUN_NUMBER}" \
            --notes "Diagnostics only. No original binary. A baseline probe does not establish UI equivalence." \
            probe-diagnostics.zip
