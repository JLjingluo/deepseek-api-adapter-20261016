name: Build experimental iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select an installed Xcode matching the original SDK generation
        run: python3 ci_xcode.py
      - name: Typecheck native test code with the matching simulator SDK
        run: |
          mkdir -p build
          exec > >(tee build/component-tests.log) 2>&1
          SIMULATOR_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          python3 - <<'PY_UI'
          from pathlib import Path
          from ci_ui_probe import create_project
          create_project(Path('build/UITypecheck'))
          PY_UI
          xcodebuild -project build/UITypecheck/NativeUIProbe.xcodeproj -scheme NativeUIProbe \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/UITypecheckBuild \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DSAPI_ADAPTER_UI DSAPI_MOCK_UI DSAPI_LIVE_UI' build-for-testing
          xcrun swiftc -typecheck -swift-version 5 -sdk "$SIMULATOR_SDK" \
            -target arm64-apple-ios18.0-simulator Tests/RuntimeProbe.swift
      - name: Test SSE and endpoint handling
        run: |
          mkdir -p build
          exec > >(tee build/component-tests.log) 2>&1
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSStreamDecoder.m Sources/DSAPIConfiguration.m Sources/DSAPILocalization.m Tests/StreamTests.m \
            -framework ImageIO -framework Foundation -framework Security -o build/StreamTests
          build/StreamTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSLocalStore.m Sources/DSAttachmentStore.m Tests/StoreTests.m -framework ImageIO -framework Foundation -o build/StoreTests
          build/StoreTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -ISources \
            Sources/DSAttachmentStore.m Tests/AttachmentTests.m -framework ImageIO -framework Foundation -o build/AttachmentTests
          build/AttachmentTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSCompatibilityProtocol.m Sources/DSLocalStore.m Sources/DSAttachmentStore.m Sources/DSOpenAIClient.m Sources/DSUsageStore.m \
            Sources/DSVoiceCatalog.m \
            Sources/DSAPIConfiguration.m Sources/DSStreamDecoder.m Sources/DSAPILocalization.m Tests/ProtocolTests.m \
            -framework ImageIO -framework Foundation -framework Security -framework AVFoundation -o build/ProtocolTests
          build/ProtocolTests --official-mode
          build/ProtocolTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSCompatibilityProtocol.m Sources/DSLocalStore.m Sources/DSAttachmentStore.m Sources/DSUploadBodyBridge.m \
            Sources/DSOpenAIClient.m Sources/DSUsageStore.m Sources/DSVoiceCatalog.m Sources/DSAPIConfiguration.m \
            Sources/DSStreamDecoder.m Sources/DSAPILocalization.m Tests/UploadTaskTests.m \
            -framework ImageIO -framework Foundation -framework Security -framework AVFoundation -o build/UploadTaskTests
          build/UploadTaskTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSOpenAIClient.m Sources/DSUsageStore.m Sources/DSAPIConfiguration.m Sources/DSStreamDecoder.m Sources/DSAPILocalization.m Tests/ClientTests.m \
            -framework ImageIO -framework Foundation -framework Security -o build/ClientTests
          build/ClientTests
      - name: Publish component failure details
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f build/component-tests.log
          gh release create "component-failure-${GITHUB_RUN_ID}" --target "$GITHUB_SHA" --prerelease \
            --title "Component failure diagnostics" --notes "Compiler and fixture output only; no live API key or input IPA." build/component-tests.log
      - name: Compile iOS arm64 library
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/objects
          for SOURCE in Sources/*.m; do
            OBJECT="build/objects/$(basename "$SOURCE" .m).o"
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=18.0 -fobjc-arc -fmodules -O2 -Wall -Wextra \
            -Wno-unused-parameter -c "$SOURCE" -o "$OBJECT"
          done
          xcrun --sdk iphoneos swiftc -sdk "$SDK" -target arm64-apple-ios18.0 -swift-version 5 \
            -O -emit-library Sources/DSRuntimeValidation.swift build/objects/*.o \
            -Xlinker -install_name -Xlinker @rpath/DSAPIAdapter.dylib \
            -framework ImageIO -framework Foundation -framework UIKit -framework Security -framework AVFoundation -framework NaturalLanguage \
            -o build/DSAPIAdapter.dylib
          codesign --force --sign - build/DSAPIAdapter.dylib
          file build/DSAPIAdapter.dylib
          shasum -a 256 build/DSAPIAdapter.dylib > build/SHA256SUMS
      - name: Obtain the exact encrypted source package
        env:
          INPUT_PASSWORD: ${{ secrets.IPA_PROBE_INPUT_PASSWORD }}
        run: |
          test -n "$INPUT_PASSWORD"
          curl --fail --location --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/probe-input-2.6.2/original.ipa.enc" \
            --output original.ipa.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in original.ipa.enc -out original.ipa -pass env:INPUT_PASSWORD
          echo '92a96bbbb7938f084a3840b4426bd891fe18dc46c1b6d4221186cb7df6cc18d9  original.ipa' | shasum -a 256 -c -
      - name: Package the adapter while verifying preserved original resources
        run: |
          python3 repack.py original.ipa build/DSAPIAdapter.dylib build/DeepSeek-API-2.6.2-experimental-unsigned.ipa
          shasum -a 256 build/*.ipa build/*.verification.json >> build/SHA256SUMS
      - name: Publish experimental full-package prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="candidate-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Experimental unsigned IPA ${GITHUB_RUN_NUMBER}" \
            --notes "实验性未签名整包，需自行签名。构建及资源校验不代表启动、UI 或功能验收通过；不能称为 100% 等价成品。附件、搜索、语音与云分享仍有未实现部分。请阅读 verification.json。" \
            build/DSAPIAdapter.dylib build/SHA256SUMS build/*.ipa build/*.verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-API-experimental-unsigned
          path: |
            build/DSAPIAdapter.dylib
            build/SHA256SUMS
            build/*.ipa
            build/*.verification.json
          retention-days: 7
