name: Build iOS adapter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test SSE and endpoint handling
        run: |
          mkdir -p build
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSStreamDecoder.m Sources/DSAPIConfiguration.m Tests/StreamTests.m \
            -framework Foundation -framework Security -o build/StreamTests
          build/StreamTests
          xcrun clang -fobjc-arc -fmodules -Wall -Wextra -Wno-unused-parameter -ISources \
            Sources/DSLocalStore.m Tests/StoreTests.m -framework Foundation -o build/StoreTests
          build/StoreTests
      - name: Compile iOS arm64 library
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/objects
          for SOURCE in Sources/*.m; do
            OBJECT="build/objects/$(basename "$SOURCE" .m).o"
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=18.0 -fobjc-arc -fmodules -O2 -Wall -Wextra \
            -Wno-unused-parameter -c "$SOURCE" -o "$OBJECT"
          done
          xcrun --sdk iphoneos swiftc -sdk "$SDK" -target arm64-apple-ios18.0 -swift-version 5 \
            -O -emit-library Sources/DSRuntimeValidation.swift build/objects/*.o \
            -Xlinker -install_name -Xlinker @rpath/DSAPIAdapter.dylib \
            -framework Foundation -framework UIKit -framework Security \
            -o build/DSAPIAdapter.dylib
          codesign --force --sign - build/DSAPIAdapter.dylib
          file build/DSAPIAdapter.dylib
          shasum -a 256 build/DSAPIAdapter.dylib > build/SHA256SUMS
      - name: Publish adapter-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="adapter-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Adapter integration candidate ${GITHUB_RUN_NUMBER}" \
            --notes "Adapter library only. No original IPA or credentials are included. Device integration remains unverified." \
            build/DSAPIAdapter.dylib build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DSAPIAdapter-arm64
          path: |
            build/DSAPIAdapter.dylib
            build/SHA256SUMS
          retention-days: 7
